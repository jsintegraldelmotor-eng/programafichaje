# Publica la carpeta app/ como página web, para que la tablet la abra.
# Con `enablement: true` el propio flujo enciende GitHub Pages la primera vez,
# así que no hay que tocar nada a mano en los ajustes del repositorio.

name: Publicar la aplicación

on:
  push:
    branches: [main, claude/exciting-ride-v08l7w]
    paths: ['app/**', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Enciende Pages si aún no lo estaba, en vez de fallar con "Not Found".
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: despliegue
        uses: actions/deploy-pages@v4
